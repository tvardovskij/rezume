<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Dmitry Tvardovsky | Fullstack Engineer</title>
    <meta name="description" content="Choose portfolio language. The site automatically opens the best-matching locale." />
    <meta name="robots" content="noindex,follow" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta name="theme-color" content="#050505" />
    

    <link rel="canonical" href="https://sdhgwow.github.io/rezume/" />
    <link rel="alternate" href="https://sdhgwow.github.io/rezume/en/" hreflang="en" />
    <link rel="alternate" href="https://sdhgwow.github.io/rezume/ru/" hreflang="ru" />
    <link rel="alternate" href="https://sdhgwow.github.io/rezume/" hreflang="x-default" />
    <link rel="manifest" href="./site.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="./logoMin.svg" />
    <link rel="apple-touch-icon" href="./icon-192.png" />

    <style>
      :root {
        color-scheme: dark;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #050505;
        color: #f3f6ff;
        font-family: Aptos, "Segoe UI Variable Text", "Segoe UI", sans-serif;
      }

      main {
        display: grid;
        gap: 14px;
        text-align: center;
        padding: 32px 24px;
      }

      p {
        margin: 0;
        color: rgba(223, 231, 255, 0.82);
      }

      a {
        color: #f3f6ff;
        text-decoration: none;
        font-weight: 700;
      }
    </style>
    
<script>
(() => {
  const storageKey = 'site-locale';
  const hash = window.location.hash || '';
  const search = window.location.search || '';
  let target = './en/';

  try {
    const savedLocale = window.localStorage.getItem(storageKey);

    if (savedLocale === 'ru') {
      target = './ru/';
    } else if (savedLocale === 'en') {
      target = './en/';
    } else {
      const browserLanguages = Array.isArray(window.navigator.languages) && window.navigator.languages.length > 0
        ? window.navigator.languages
        : [window.navigator.language].filter(Boolean);

      const prefersRussian = browserLanguages.some((language) => /^ru\b/i.test(language));
      target = prefersRussian ? './ru/' : './en/';
      window.localStorage.setItem(storageKey, prefersRussian ? 'ru' : 'en');
    }
  } catch {
    const browserLanguages = Array.isArray(window.navigator.languages) && window.navigator.languages.length > 0
      ? window.navigator.languages
      : [window.navigator.language].filter(Boolean);

    const prefersRussian = browserLanguages.some((language) => /^ru\b/i.test(language));
    target = prefersRussian ? './ru/' : './en/';
  }

  window.location.replace(target + search + hash);
})();
</script>
  </head>
  <body>
    <main>
      <p>Redirecting to the best matching locale…</p>
      <p>
        <a href="./en/" lang="en">English</a>
        ·
        <a href="./ru/" lang="ru">Русский</a>
      </p>
    </main>
  </body>
</html>
