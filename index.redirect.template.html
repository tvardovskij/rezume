<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>%SEO_SITE_NAME%</title>
    <meta name="description" content="%SEO_DESCRIPTION%" />
    <meta name="robots" content="noindex,follow" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta name="theme-color" content="#050505" />
    %SEO_OPTIONAL_META_TAGS%

    <link rel="canonical" href="%SEO_CANONICAL_URL%" />
    %SEO_ALTERNATE_LINKS%
    <link rel="manifest" href="%SEO_MANIFEST_PATH%" />
    <link rel="icon" type="image/svg+xml" href="%SEO_ICON_SVG_PATH%" />
    <link rel="apple-touch-icon" href="%SEO_APPLE_TOUCH_ICON_PATH%" />

    <style>
      :root {
        color-scheme: dark;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #050505;
        color: #f3f6ff;
        font-family: Aptos, "Segoe UI Variable Text", "Segoe UI", sans-serif;
      }

      main {
        display: grid;
        gap: 14px;
        text-align: center;
        padding: 32px 24px;
      }

      p {
        margin: 0;
        color: rgba(223, 231, 255, 0.82);
      }

      a {
        color: #f3f6ff;
        text-decoration: none;
        font-weight: 700;
      }
    </style>
    %SEO_INITIAL_SCRIPT%
  </head>
  <body>
    <main>
      <p>Redirecting to the best matching locale…</p>
      <p>
        <a href="%SEO_EN_PATH%" lang="en">English</a>
        ·
        <a href="%SEO_RU_PATH%" lang="ru">Русский</a>
      </p>
    </main>
  </body>
</html>
