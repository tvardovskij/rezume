<!doctype html>
<html lang="%SEO_LANG%">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>%SEO_TITLE%</title>
    <meta name="application-name" content="%SEO_SITE_NAME%" />
    <meta name="apple-mobile-web-app-title" content="%SEO_SITE_SHORT_NAME%" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="description" content="%SEO_DESCRIPTION%" />
    <meta name="keywords" content="%SEO_KEYWORDS%" />
    <meta name="author" content="%SEO_AUTHOR%" />
    <meta name="robots" content="%SEO_ROBOTS%" />
    <meta name="googlebot" content="%SEO_ROBOTS%" />
    <meta name="referrer" content="%SEO_REFERRER%" />
    <meta name="theme-color" content="%SEO_THEME_COLOR%" />
    <meta name="format-detection" content="telephone=no,address=no,email=no" />
    %SEO_OPTIONAL_META_TAGS%

    <link rel="canonical" href="%SEO_CANONICAL_URL%" />
    <link rel="alternate" href="%SEO_CANONICAL_URL%" hreflang="%SEO_HREFLANG%" />
    <link rel="alternate" href="%SEO_CANONICAL_URL%" hreflang="x-default" />
    <link
      rel="preload"
      as="image"
      href="/media/hero/hero-poster.webp"
      fetchpriority="high"
      type="image/webp"
    />
    <link rel="manifest" href="%SEO_MANIFEST_PATH%" />
    <link rel="icon" type="image/svg+xml" href="%SEO_ICON_SVG_PATH%" />
    <link rel="apple-touch-icon" href="%SEO_APPLE_TOUCH_ICON_PATH%" />

    <meta property="og:locale" content="%SEO_OG_LOCALE%" />
    <meta property="og:locale:alternate" content="%SEO_OG_LOCALE_ALT%" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="%SEO_SITE_NAME%" />
    <meta property="og:title" content="%SEO_OG_TITLE%" />
    <meta property="og:description" content="%SEO_OG_DESCRIPTION%" />
    <meta property="og:url" content="%SEO_OG_URL%" />
    <meta property="og:image" content="%SEO_OG_IMAGE_URL%" />
    <meta property="og:image:secure_url" content="%SEO_OG_IMAGE_URL%" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="%SEO_OG_IMAGE_ALT%" />
    <meta property="og:updated_time" content="%SEO_OG_UPDATED_TIME%" />
    <meta property="vk:image" content="%SEO_OG_IMAGE_URL%" />

    <meta name="twitter:card" content="%SEO_TWITTER_CARD%" />
    <meta name="twitter:title" content="%SEO_TWITTER_TITLE%" />
    <meta name="twitter:description" content="%SEO_TWITTER_DESCRIPTION%" />
    <meta name="twitter:url" content="%SEO_TWITTER_URL%" />
    <meta name="twitter:image" content="%SEO_TWITTER_IMAGE_URL%" />
    <meta name="twitter:image:alt" content="%SEO_TWITTER_IMAGE_ALT%" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap"
      />
    </noscript>

    <script type="application/ld+json">
%SEO_JSON_LD%
    </script>
  </head>
  <body>
    <noscript>%SEO_NOSCRIPT%</noscript>
    <div id="root" role="main"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
